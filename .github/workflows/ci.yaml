name: Test
on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Run the toolchain setup-go installed; without this, the go directive in go.mod
      # makes Go download and switch to that version, so every matrix entry runs the same Go.
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "oldstable"
          - "stable"
    steps:
    - uses: actions/checkout@v4

    - name: Setup Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: true
    - name: Display Go version
      run: go version
    - name: Test
      run: make test
