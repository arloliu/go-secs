stream: 2
messages:
  - function: 1
    name: Service Program Load Inquire
    mnemonic: SPI
    direction: bidirectional
    description: Either the host or equipment wants to send the specified service program.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure: {type: list, items: [{item: SPID}, {item: LENGTH}]}

  - function: 2
    name: Service Program Load Grant
    mnemonic: SPG
    direction: bidirectional
    description: Provides permission to load.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure: {item: GRANT}

  - function: 3
    name: Service Program Send
    mnemonic: SPS
    direction: bidirectional
    description: >-
      The data associated with the S2F1 inquire is sent. If S2F3 is multi-block, it must be preceded
      by the S2F1/S2F2 Inquire/Grant transaction.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure: {item: SPD}

  - function: 4
    name: Service Program Send Acknowledge
    mnemonic: SPA
    direction: bidirectional
    description: Acknowledge or error.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure: {item: SPAACK}

  - function: 5
    name: Service Program Load Request
    mnemonic: SPR
    direction: bidirectional
    description: A service program is requested.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure: {item: SPID}

  - function: 6
    name: Service Program Load Data
    mnemonic: SPD
    direction: bidirectional
    description: A service program is sent.
    exception: A zero-length item means that the requested program cannot be returned.
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure: {item: SPD}

  - function: 7
    name: Service Program Run Send
    mnemonic: CSS
    direction: host-to-equipment
    description: Start the requested program.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure: {item: SPID}

  - function: 8
    name: Service Program Run Acknowledge
    mnemonic: CSA
    direction: equipment-to-host
    description: Acknowledge or error.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure: {item: CSAACK}

  - function: 9
    name: Service Program Results Request
    mnemonic: SRR
    direction: host-to-equipment
    description: Ask for results of service program.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure: {item: SPID}

  - function: 10
    name: Service Program Results Data
    mnemonic: SRD
    direction: equipment-to-host
    description: Get the results back.
    exception: A zero-length item means SPR does not exist.
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure: {item: SPR}

  - function: 11
    name: Service Program Directory Request
    mnemonic: SDR
    direction: bidirectional
    description: There may be more than one service program.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure: null

  - function: 12
    name: Service Program Directory Data
    mnemonic: SDD
    direction: bidirectional
    description: A list of service program names.
    exception: If n = 0, there are no service programs.
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure: {type: list, repeat: spids, of: {item: SPID}}

  # E5 also documents a legacy packed alternative (<ECID1,...,ECIDn>) "for compatibility with previous
  # implementations" and usable only for format 3()/5() items. Per the phase constraint, only the
  # approved list form is generated here (see the same exclusion for S2F23's SVID sub-list).
  - function: 13
    name: Equipment Constant Request
    mnemonic: ECR
    direction: host-to-equipment
    description: >-
      Constants such as for calibration, servo gain, alarm limits, data collection mode, and other
      values that are changed infrequently can be obtained using this message.
    exception: A zero-length list means report all ECVs according to a predefined order.
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure: {type: list, repeat: ecids, of: {item: ECID}}

  - function: 14
    name: Equipment Constant Data
    mnemonic: ECD
    direction: equipment-to-host
    description: Data response to S2F13 in the order requested.
    exception: >-
      A zero-length list item for ECVi means that ECIDi does not exist. The list format for this data
      item is not allowed, except in this case.
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure: {type: list, repeat: ecvs, of: {item: ECV}}

  - function: 15
    name: New Equipment Constant Send
    mnemonic: ECS
    direction: host-to-equipment
    description: Change one or more equipment constants.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure:
          type: list
          repeat: constants
          of: {type: list, items: [{item: ECID}, {item: ECV}]}

  - function: 16
    name: New Equipment Constant Acknowledge
    mnemonic: ECA
    direction: equipment-to-host
    description: >-
      Acknowledge or error. If EAC contains a non-zero error code, the equipment does not change any
      of the ECIDs specified in S2F15.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure: {item: EAC}

  - function: 17
    name: Date and Time Request
    mnemonic: DTR
    direction: bidirectional
    description: Useful to check equipment time base or for equipment to synchronize with the host time base.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure: null

  - function: 18
    name: Date and Time Data
    mnemonic: DTD
    direction: bidirectional
    description: Actual time data.
    exception: A zero-length item means no time exists.
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure: {item: TIME}

  - function: 19
    name: Reset/Initialize Send
    mnemonic: RIS
    direction: host-to-equipment
    description: Causes equipment to reach one of several predetermined initialized conditions.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure: {item: RIC}

  - function: 20
    name: Reset Acknowledge
    mnemonic: RIA
    direction: equipment-to-host
    description: Acknowledge or error.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure: {item: RAC}

  - function: 21
    name: Remote Command Send
    mnemonic: RCS
    direction: host-to-equipment
    description: >-
      Similar to pressing buttons on the front panel or causes some equipment activity to commence or
      to cease.
      Callers that require a no-reply variant should use [secs2.NewMessage] directly.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure: {item: RCMD}

  - function: 22
    name: Remote Command Acknowledge
    mnemonic: RCA
    direction: equipment-to-host
    description: Acknowledge or error.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure: {item: CMDA}

  # E5 also documents a legacy packed alternative for the SVID sub-list (<SVID1,...,SVIDn>) "for
  # compatibility with previous implementations" and usable only for format 3()/5() items. Per the
  # phase constraint, only the approved L,n repeat form of the SVID sub-list is generated here.
  - function: 23
    name: Trace Initialize Send
    mnemonic: TIS
    direction: host-to-equipment
    description: >-
      Status variables exist at all times. This function provides a way to sample a subset of those
      status variables as a function of time. The trace data is returned on S6F1 and is related to the
      original request by the TRID. If equipment receives S2F23 with the same TRID as a trace function
      currently in progress, the equipment should terminate the old trace and then initiate the new
      trace. A trace currently in progress may be terminated by S2F23 with that TRID and TOTSMP = 0. If
      S2F23 is multi-block, it must be preceded by the S2F39/S2F40 Inquire/Grant transaction.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure:
          type: list
          items:
            - {item: TRID}
            - {item: DSPER}
            - {item: TOTSMP}
            - {item: REPGSZ}
            - {type: list, repeat: svids, of: {item: SVID}}

  - function: 24
    name: Trace Initialize Acknowledge
    mnemonic: TIA
    direction: equipment-to-host
    description: Acknowledge or error.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure: {item: TIAACK}

  - function: 25
    name: Loopback Diagnostic Request
    mnemonic: LDR
    direction: bidirectional
    description: >-
      A diagnostic message for checkout of protocol and communication circuits. The binary string sent
      is echoed back.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure: {item: ABS}

  - function: 26
    name: Loopback Diagnostic Data
    mnemonic: LDD
    direction: bidirectional
    description: The echoed binary string.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure: {item: ABS}

  - function: 27
    name: Initiate Processing Request
    mnemonic: IPR
    direction: host-to-equipment
    description: >-
      Host requests equipment to initiate processing of the identified material at the specified
      location in the machine using the specified process program.
    exception: >-
      A zero-length PPID indicates no process program is being specified and the equipment is to take
      whatever action is appropriate for it to determine the proper program to use. A zero-length MID
      list indicates no MID is to be associated with the material to be processed.
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure:
          type: list
          items:
            - {item: LOC}
            - {item: PPID}
            - {type: list, repeat: mids, of: {item: MID}}

  - function: 28
    name: Initiate Processing Acknowledge
    mnemonic: IPA
    direction: equipment-to-host
    description: >-
      Response by equipment to Initiate Processing Request. Returned status indicates whether or not
      the request was honored by the equipment.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure: {item: CMDA}

  - function: 29
    name: Equipment Constant Namelist Request
    mnemonic: ECNR
    direction: host-to-equipment
    description: >-
      This function allows the host to retrieve basic information about what equipment constants are
      available in the equipment.
    exception: A zero-length list means send information for all ECIDs.
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure: {type: list, repeat: ecids, of: {item: ECID}}

  - function: 30
    name: Equipment Constant Namelist
    mnemonic: ECN
    direction: equipment-to-host
    description: Data response.
    exception: >-
      Zero-length ASCII items for ECNAMEi, ECMINi, ECMAXi, ECDEFi, and UNITSi indicate that the ECID
      does not exist.
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure:
          type: list
          repeat: constants
          of:
            type: list
            items:
              - {item: ECID}
              - {item: ECNAME}
              - {item: ECMIN}
              - {item: ECMAX}
              - {item: ECDEF}
              - {item: UNITS}

  - function: 31
    name: Date and Time Set Request
    mnemonic: DTS
    direction: host-to-equipment
    description: Useful to synchronize the equipment time with the host time base.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure: {item: TIME}

  - function: 32
    name: Date and Time Set Acknowledge
    mnemonic: DTA
    direction: equipment-to-host
    description: Acknowledge the receipt of time and date.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure: {item: TIACK}

  - function: 33
    name: Define Report
    mnemonic: DR
    direction: host-to-equipment
    description: >-
      The host defines a group of reports for the equipment. The type of report is designated by a
      Boolean equipment constant: a value of False means an Event Report (S6F11) will be sent, and a
      value of True means an Annotated Event Report (S6F13) will be sent. If S2F33 is multi-block, it
      must be preceded by the S2F39/S2F40 Inquire/Grant transaction.
    exception: >-
      A list of zero length following DATAID deletes all report definitions and associated links (see
      S2F35). A list of zero length following a RPTID deletes that report type; all CEID links to that
      RPTID are also deleted.
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure:
          type: list
          items:
            - {item: DATAID}
            - type: list
              repeat: reports
              of:
                type: list
                items:
                  - {item: RPTID}
                  - {type: list, repeat: vids, of: {item: VID}}

  - function: 34
    name: Define Report Acknowledge
    mnemonic: DRA
    direction: equipment-to-host
    description: >-
      Acknowledge or error. If an error condition is detected the entire message is rejected (i.e.,
      partial changes are not allowed).
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure: {item: DRACK}

  - function: 35
    name: Link Event Report
    mnemonic: LER
    direction: host-to-equipment
    description: >-
      The host links n reports to an event (CEID). These linked event reports default to disabled upon
      linking; the occurrence of an event does not cause the report to be sent until enabled (see
      S2F37). If S2F35 is multi-block, it must be preceded by the S2F39/S2F40 Inquire/Grant
      transaction.
    exception: A list of zero length following a CEID deletes all report links to that event.
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure:
          type: list
          items:
            - {item: DATAID}
            - type: list
              repeat: events
              of:
                type: list
                items:
                  - {item: CEID}
                  - {type: list, repeat: rptids, of: {item: RPTID}}

  - function: 36
    name: Link Event Report Acknowledge
    mnemonic: LERA
    direction: equipment-to-host
    description: >-
      Acknowledge or error. If an error condition is detected the entire message is rejected (i.e.,
      partial changes are not allowed).
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure: {item: LRACK}

  - function: 37
    name: Enable/Disable Event Report
    mnemonic: EDER
    direction: host-to-equipment
    description: >-
      The host enables or disables reporting for a group of events (CEIDs). When n is not zero, this
      message enables or disables reporting for the listed CEIDs; reporting for unlisted CEIDs is not
      affected.
    exception: A list of zero length following CEED means all CEIDs.
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure:
          type: list
          items:
            - {item: CEED}
            - {type: list, repeat: ceids, of: {item: CEID}}

  - function: 38
    name: Enable/Disable Event Report Acknowledge
    mnemonic: EERA
    direction: equipment-to-host
    description: >-
      Acknowledge or error. If an error condition is detected the entire message is rejected (i.e.,
      partial changes are not allowed).
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure: {item: ERACK}

  - function: 39
    name: Multi-block Inquire
    mnemonic: DMBI
    direction: host-to-equipment
    description: >-
      If an S2F23, S2F33, S2F35, S2F45, or S2F49 message is more than one block, this transaction must
      precede the message.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure: {type: list, items: [{item: DATAID}, {item: DATALENGTH}]}

  - function: 40
    name: Multi-block Grant
    mnemonic: DMBG
    direction: equipment-to-host
    description: Grant permission to send a multi-block message.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure: {item: GRANT}

  - function: 41
    name: Host Command Send
    mnemonic: HCS
    direction: host-to-equipment
    description: >-
      The host requests the equipment perform the specified remote command with the associated
      parameters.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure:
          type: list
          items:
            - {item: RCMD}
            - type: list
              repeat: params
              of: {type: list, items: [{item: CPNAME}, {item: CPVAL}]}

  - function: 42
    name: Host Command Acknowledge
    mnemonic: HCA
    direction: equipment-to-host
    description: >-
      Acknowledge host command or error. If the command is not accepted due to one or more invalid
      parameters (i.e., HCACK = 3), a list of invalid parameters is returned containing the parameter
      name and reason for being invalid.
    exception: If there are no invalid parameters, a list of zero length is sent for the second item.
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure:
          type: list
          items:
            - {item: HCACK}
            - type: list
              repeat: params
              of: {type: list, items: [{item: CPNAME}, {item: CPACK}]}

  - function: 43
    name: Reset Spooling Streams and Functions
    mnemonic: RSSF
    direction: host-to-equipment
    description: >-
      The host selects specific streams and functions to be spooled whenever spooling is active. A
      defined list of functions for a stream replaces any previously selected functions. Spooling for
      Stream 1 is not allowed.
    exception: >-
      A zero-length list, m = 0, turns off spooling for all streams and functions. A zero-length list,
      n = 0, turns on spooling for all functions for the associated stream.
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure:
          type: list
          repeat: streams
          of:
            type: list
            items:
              - {item: STRID}
              - {type: list, repeat: fcnids, of: {item: FCNID}}

  - function: 44
    name: Reset Spooling Acknowledge
    mnemonic: RSA
    direction: equipment-to-host
    description: Acknowledge or error.
    exception: >-
      If RSPACK = 0, a zero-length list, m = 0, is given, indicating no streams or functions in error.
      A zero-length list, n = 0, indicates no functions in error for the specified stream.
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure:
          type: list
          items:
            - {item: RSPACK}
            - type: list
              repeat: streams
              of:
                type: list
                items:
                  - {item: STRID}
                  - {item: STRACK}
                  - {type: list, repeat: fcnids, of: {item: FCNID}}

  - function: 45
    name: Define Variable Limit Attributes
    mnemonic: DVLA
    direction: host-to-equipment
    description: >-
      The host defines or changes the limit attributes for a group of variables. Each limit carries an
      upper and lower deadband pair. If S2F45 is multi-block, it must be preceded by the S2F39/S2F40
      Inquire/Grant transaction.
    exception: >-
      A zero-length list, m = 0, sets all limit values for all monitored VIDs to undefined. A
      zero-length list, n = 0, sets all limit values for that VID to undefined. A zero-length list,
      p = 0, sets that limit to undefined.
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure:
          type: list
          items:
            - {item: DATAID}
            - type: list
              repeat: variables
              of:
                type: list
                items:
                  - {item: VID}
                  - type: list
                    repeat: limits
                    of:
                      type: list
                      items:
                        - {item: LIMITID}
                        - type: list
                          minItems: 0
                          maxItems: 2
                          items: [{item: UPPERDB}, {item: LOWERDB}]

  - function: 46
    name: Variable Limit Attribute Acknowledge
    mnemonic: VLAA
    direction: equipment-to-host
    description: >-
      Acknowledge definition of variable limit attributes or report error. If the definition is not
      accepted due to one or more invalid parameters (e.g., LIMITACK = 3), a list of invalid parameters
      is returned containing the variable limit attribute and reason for rejection. If an error
      condition is detected, the entire message is rejected (i.e., partial changes are not allowed).
    exception: >-
      A zero-length list, m = 0, indicates no invalid variable limit attributes. A zero-length list,
      n = 0, indicates no invalid limit values for that VID.
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure:
          type: list
          items:
            - {item: VLAACK}
            - type: list
              repeat: variables
              of:
                type: list
                items:
                  - {item: VID}
                  - {item: LVACK}
                  - type: list
                    minItems: 0
                    maxItems: 2
                    items: [{item: LIMITID}, {item: LIMITACK}]

  - function: 47
    name: Variable Limit Attribute Request
    mnemonic: VLAR
    direction: host-to-equipment
    description: The host queries the equipment for current variable limit attribute definitions.
    exception: >-
      A zero-length list, m = 0, requests a list of all VID values that can have variable limit
      attributes.
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure: {type: list, repeat: vids, of: {item: VID}}

  - function: 48
    name: Variable Limit Attributes Send
    mnemonic: VLAS
    direction: equipment-to-host
    description: >-
      Equipment sends the values of the requested variable limit attribute definitions in the order
      requested.
    exception: >-
      A zero-length list, p = 0, indicates that limits are not supported for the VID. A zero-length
      list, n = 0, means no limits are currently defined for the specified variable.
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure:
          type: list
          repeat: variables
          of:
            type: list
            items:
              - {item: VID}
              - type: list
                minItems: 0
                maxItems: 4
                items:
                  - {item: UNITS}
                  - {item: LIMITMIN}
                  - {item: LIMITMAX}
                  - type: list
                    repeat: limits
                    of:
                      type: list
                      items: [{item: LIMITID}, {item: UPPERDB}, {item: LOWERDB}]

  - function: 49
    name: Enhanced Remote Command
    mnemonic: ""
    direction: host-to-equipment
    description: >-
      The host requests an object to perform the specified remote command with its associated
      parameters (DATAID, OBJSPEC, RCMD, and a list of CPNAME/CEPVAL parameter groups). If multi-block,
      it must be preceded by the S2F39/S2F40 Multi-block Inquire/Grant transaction. The body is opaque
      because each CEPVAL's shape is chosen at the value level and cannot be described by a static
      structure: a given CEPVAL may be a single scalar, a list of same-format items, or a recursively
      nested list of CPNAME/CEPVAL pairs. The caller assembles the body manually via secs2 primitives.
    exception: >-
      A zero-length list, m = 0, indicates that no parameter groups are sent with the command. OBJSPEC
      may be a null-length item.
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure: {type: opaque}

  - function: 50
    name: Enhanced Remote Command Acknowledge
    mnemonic: ""
    direction: equipment-to-host
    description: >-
      The equipment acknowledges an Enhanced Remote Command (S2F49) or reports any errors. If the
      command is not accepted due to one or more invalid parameters (i.e., HCACK = 3), a list of
      invalid parameters is returned containing the parameter name (CPNAME) and reason for being
      invalid (CEPACK). The body is opaque because each CEPACK mirrors the value-dependent, possibly
      recursively nested shape of the corresponding CEPVAL in S2F49, which cannot be described by a
      static structure. The caller assembles the body manually via secs2 primitives.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure: {type: opaque}
