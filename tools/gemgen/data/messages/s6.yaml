          type: list
          items:
            - {item: DATAID}
            - {item: CEID}
            - type: list
              repeat: reports
              of:
                type: list
                items:
                  - {item: RPTID}
                  - {type: list, repeat: values, of: {item: V}}

  - function: 17
    name: Annotated Event Report Request
    mnemonic: AERR
    direction: host-to-equipment
    description: Same as S6F15, but requests annotated reports.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure: {item: CEID}

  - function: 18
    name: Annotated Event Report Data
    mnemonic: AERD
    direction: equipment-to-host
    description: Equipment sends the annotated reports linked to the given CEID. The structure is the same as S6F13.
    exception: A zero-length item means there are no reports linked to the given CEID.
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure:
          type: list
          items:
            - {item: DATAID}
            - {item: CEID}
            - type: list
              repeat: reports
              of:
                type: list
                items:
                  - {item: RPTID}
                  - type: list
                    repeat: values
                    of: {type: list, items: [{item: VID}, {item: V}]}

  - function: 19
    name: Individual Report Request
    mnemonic: IRR
    direction: host-to-equipment
    description: The purpose of this message is for the host to request a defined report from the equipment.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure: {item: RPTID}

  - function: 20
    name: Individual Report Data
    mnemonic: IRD
    direction: equipment-to-host
    description: Equipment sends the variable data defined for the given RPTID to the host.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure: {type: list, repeat: values, of: {item: V}}

  - function: 21
    name: Annotated Individual Report Request
    mnemonic: AIRR
    direction: host-to-equipment
    description: The purpose of this message is for the host to request an annotated defined report from the equipment.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure: {item: RPTID}

  - function: 22
    name: Annotated Individual Report Data
    mnemonic: AIRD
    direction: equipment-to-host
    description: Equipment sends the annotated variable data defined for the given RPTID to the host.
    exception: A zero-length list for the variable-data-item count means the RPTID is not defined.
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure:
          type: list
          repeat: values
          of: {type: list, items: [{item: VID}, {item: V}]}

  - function: 23
    name: Request Spooled Data
    mnemonic: RSD
    direction: host-to-equipment
    description: >-
      The purpose of this message is for the host to request transmission or deletion of the messages
      currently spooled by the equipment.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure: {item: RSDC}

  - function: 24
    name: Request Spooled Data Acknowledgement Send
    mnemonic: RSDAS
    direction: equipment-to-host
    description: >-
      The purpose of this message is to acknowledge the receipt of the Request Spooled Data (S6F23)
      and to respond with an appropriate acknowledge code.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure: {item: RSDA}

  - function: 25
    name: Notification Report Send
    mnemonic: NRS
    direction: bidirectional
    description: >-
      This message is used for change notifications or confirmation reports. A change notification is
      a report of an internal action not associated with a prior host request. A confirmation report
      is always associated with an earlier request for action and is sent to the initial requestor of
      a delayed action at the time the action completes. OPID contains the value of OPID in the initial
      request. LINKID is set to a non-zero value if and only if additional completion reports with the
      same OPID will be sent. If S6F25 is multi-block, it must be preceded by the S6F5/S6F6 Inquire/Grant
      transaction.
      Callers that require a no-reply variant should use [secs2.NewMessage] directly.
    exception: >-
      OPID and LINKID are zero-length items when and only when S6F25 is sent as a change notification
      rather than as a confirmation report. p = 0 if and only if RMACK indicates no errors.
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure:
          type: list
          items:
            - {item: DATAID}
            - {item: OPID}
            - {item: LINKID}
            - {item: RCPSPEC}
            - {item: RMCHGSTAT}
            - type: list
              repeat: attributes
              of: {type: list, items: [{item: RCPATTRID}, {item: RCPATTRDATA}]}
            - type: list
              items:
                - {item: RMACK}
                - type: list
                  repeat: errors
                  of: {type: list, items: [{item: ERRCODE}, {item: ERRTEXT}]}

  - function: 26
    name: Notification Report Send Acknowledge
    mnemonic: NRA
    direction: bidirectional
    description: >-
      This message is used to acknowledge the confirmation report. It is defined for completeness and
      as an aid to the user in identifying problems.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure: {item: ACKC6}

  - function: 27
    name: Trace Report Send
    mnemonic: TRS
    direction: equipment-to-host
    description: >-
      The equipment sends a completed Trace Report to the host. The outer list carries up to the trace
      group size specified by S2F53 samples; each sample carries one entry per report, and each report
      pairs its RPTID with the list of variable values for that report.
      Callers that require a no-reply variant should use [secs2.NewMessage] directly.
    exception: >-
      The list of variables associated with each unique RPTID is itself unique; this structure
      illustrates the form of the message only, so in general V1 for one RPTID and V1 for another do
      not reference the same variable.
    source: e5
    bodies:
      - actor: both
        replyExpected: true
        structure:
          type: list
          items:
            - {item: DATAID}
            - {item: TRID}
            - type: list
              repeat: samples
              of:
                type: list
                repeat: reports
                of:
                  type: list
                  items:
                    - {item: RPTID}
                    - {type: list, repeat: values, of: {item: V}}

  - function: 28
    name: Trace Report Send Acknowledge
    mnemonic: TRSA
    direction: host-to-equipment
    description: The host acknowledges receipt of the Trace Report.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure: {item: TRID}

  - function: 29
    name: Trace Report Request
    mnemonic: TRR
    direction: host-to-equipment
    description: >-
      Request that the data reports assigned to the trace report be sampled and returned to the host.
    exception: None
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure: {item: TRID}

  - function: 30
    name: Trace Report Data
    mnemonic: TRD
    direction: equipment-to-host
    description: >-
      Message containing the requested data reports associated with the TRID of a trace data report
      definition.
    exception: >-
      If TRID is unknown, a zero-length list (n = 0) is sent. ERRCODE is set to zero length when there
      is no error.
    source: e5
    bodies:
      - actor: both
        replyExpected: false
        structure:
          type: list
          items:
            - {item: TRID}
            - type: list
              repeat: reports
              of:
                type: list
                items:
                  - {item: RPTID}
                  - {type: list, repeat: values, of: {item: V}}
            - {item: ERRCODE}
